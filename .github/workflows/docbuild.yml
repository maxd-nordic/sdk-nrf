name: Documentation Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'v*-branch'
    paths:
      - '.github/workflows/docbuild.yml'
      - '**.rst'
      - '**/Kconfig'
      - '**/sample.yaml'
      - 'doc/**'
      - 'applications/**'
      - 'include/**'
      - 'lib/**'
      - 'doc/requirements.txt'
      - 'scripts/tools-versions-*.yml'
      - 'west.yml'
  push:
    branches:
      - main
      - 'v*-branch'
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: ncs/nrf

      - name: Rebase
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        working-directory: ncs/nrf
        run: |
          git config --global user.email "actions@zephyrproject.org"
          git config --global user.name "Github Actions"
          rm -fr ".git/rebase-apply"
          rm -fr ".git/rebase-merge"
          git rebase origin/${BASE_REF}
          git clean -f -d
          git log --graph --oneline HEAD...${PR_HEAD}

      - name: Install packages
        working-directory: ncs
        run: |
          sudo apt update
          sudo apt-get install -y wget python3-pip git ninja-build graphviz lcov mscgen plantuml ninja-build mscgen plantuml python3-venv python3-wheel python3-setuptools clang sqlite3
          sudo snap install yq
          DOXYGEN_VERSION=$(yq ".doxygen.version" nrf/scripts/tools-versions-linux.yml)
          wget --no-verbose "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar xf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
          echo "${PWD}/doxygen-${DOXYGEN_VERSION}/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: ncs/nrf/doc/requirements.txt

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@6a744370a22e4ecb24f5dda3c7e80ff3e0a3b847 # v1.0.8
        with:
          base-path: ncs
          app-path: nrf
          toolchains: 'all'

      - name: install-pip
        working-directory: ncs
        run: |
          pip3 install -r nrf/scripts/requirements-fixed.txt
          pip3 install -r nrf/doc/requirements.txt
          pip3 install git+https://github.com/maxd-nordic/doc-sphinx-ncs-theme.git@128f7aa4629ea63f835f2fa6241dfe4ba746d17e --ignore-installed
          pip3 install doc2dash

      - name: West zephyr-export
        working-directory: ncs
        run: |
          west zephyr-export

      - name: Install toolchain
        working-directory: ncs
        run: |
          sudo apt install --no-install-recommends git cmake ninja-build gperf \
          ccache dfu-util device-tree-compiler wget python3-dev python3-venv python3-tk \
          xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Build documentation
        working-directory: ncs/nrf
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BUILD_CONF="-DDTS_BINDINGS=ON -DHW_FEATURES=ON"
          fi

          cmake -GNinja -Bdoc/_build -Sdoc -DSPHINXOPTS_EXTRA="-q" ${BUILD_CONF}
          ninja -C doc/_build

      - name: Check version
        run: |
          VERSION_REGEX="^v([0-9a-zA-Z\.\-]+)$"
          if [[ ${GITHUB_REF#refs/tags/} =~ $VERSION_REGEX ]]; then
            VERSION=${BASH_REMATCH[1]}
          elif [[ ${GITHUB_REF#refs/heads/} == "main" ]]; then
            VERSION="latest"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.number }}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Prepare legacy upload
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'external') || contains(github.event.pull_request.labels.*.name, 'CI-trusted-author') }}
        working-directory: ncs/nrf
        run: |
          MONITOR="monitor_${{ github.run_id }}.txt"

          # Create documentation upload files
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ARCHIVE="legacy-ncs-pr-${{ github.event.number }}.zip"
            echo "publish2 dev PR-${{ github.event.number }} ${ARCHIVE}" > "${MONITOR}"
            echo "${{ github.event.number }}" > pr.txt
          else
            if [ -z "${VERSION}" ]; then
              echo "Not a release or latest, skipping publish"
              exit 0
            fi

            ARCHIVE="legacy-ncs-${VERSION}.zip"
            echo "publish2 main ${VERSION} ${ARCHIVE}" > "${MONITOR}"
          fi

          cd doc/_build/html
          zip -rq "${ARCHIVE}" .
          mv "${ARCHIVE}" ../../../

      - name: Build Docsets
        working-directory: ncs/nrf/doc/_build
        run: |
          mkdir docsets
          doc2dash -d docsets/ -n kconfig html/kconfig
          doc2dash -d docsets/ -n matter html/matter
          doc2dash -d docsets/ -n mcuboot html/mcuboot --index-page wrapper.html
          doc2dash -d docsets/ -n nrf html/nrf
          doc2dash -d docsets/ -n nrfxlib html/nrfxlib --index-page README.html
          doc2dash -d docsets/ -n tfm html/tfm
          doc2dash -d docsets/ -n zephyr html/zephyr
          PYTHONPATH=../ doc2dash --parser doc2dash_parsers.doxygen.DoxygenParser  -d docsets/ -n nrfx html/nrfx/html
          PYTHONPATH=../ doc2dash --parser doc2dash_parsers.doxygen.DoxygenParser  -d docsets/ -n wifi html/wifi/html

      - name: Add docset icons
        working-directory: ncs/nrf/doc/
        run: |
          cp docset-logos/zephyr-logo.png _build/docsets/kconfig.docset/icon.png
          cp docset-logos/matter-logo.png _build/docsets/matter.docset/icon.png
          cp docset-logos/mcuboot-logo.png _build/docsets/mcuboot.docset/icon.png
          cp docset-logos/nordic-logo.png _build/docsets/nrf.docset/icon.png
          cp docset-logos/nordic-logo.png _build/docsets/nrfxlib.docset/icon.png
          cp docset-logos/tfm-logo.png _build/docsets/tfm.docset/icon.png
          cp docset-logos/zephyr-logo.png _build/docsets/zephyr.docset/icon.png
          cp docset-logos/nordic-logo.png _build/docsets/nrfx.docset/icon.png
          cp docset-logos/nordic-logo.png _build/docsets/wifi.docset/icon.png

      - name: Fix KConfig docset
        working-directory: ncs/nrf/doc/_build/docsets/kconfig.docset/Contents/Resources/Documents
        run: python3 ../../../../../../_scripts/rebuild_kconfig_index.py

      - name: Filter out group elements from Zephyr docset
        working-directory: ncs/nrf/doc/_build/docsets/zephyr.docset/Contents/Resources/Documents
        run: python3 ../../../../../../_scripts/filter_docset_index.py

      - name: Filter out group elements from nrf docset
        working-directory: ncs/nrf/doc/_build/docsets/nrf.docset/Contents/Resources/Documents
        run: python3 ../../../../../../_scripts/filter_docset_index.py

      - name: Filter out group elements from nrfxlib docset
        working-directory: ncs/nrf/doc/_build/docsets/nrfxlib.docset/Contents/Resources/Documents
        run: python3 ../../../../../../_scripts/filter_docset_index.py

      - name: Fix links between docsets
        working-directory: ncs/nrf/doc/_build/docsets/
        run: |
          find . -type f -name "*.html" -exec sed -i -E 's#(a|class=\"reference external\") href="([^"]*)\.\./nrfxlib/([^"]*)"#\1 href=\"\2../../../../../nrfxlib.docset/Contents/Resources/Documents/\3"#g' {} +
          find . -type f -name "*.html" -exec sed -i -E 's#(a|class=\"reference external\") href="([^"]*)\.\./mcuboot/([^"]*)"#\1 href=\"\2../../../../../mcuboot.docset/Contents/Resources/Documents/\3"#g' {} +
          find . -type f -name "*.html" -exec sed -i -E 's#(a|class=\"reference external\") href="([^"]*)\.\./matter/([^"]*)"#\1 href=\"\2../../../../../matter.docset/Contents/Resources/Documents/\3"#g' {} +
          find . -type f -name "*.html" -exec sed -i -E 's#(a|class=\"reference external\") href="([^"]*)\.\./kconfig/([^"]*)"#\1 href=\"\2../../../../../kconfig.docset/Contents/Resources/Documents/\3"#g' {} +
          find . -type f -name "*.html" -exec sed -i -E 's#(a|class=\"reference external\") href="([^"]*)\.\./nrf/([^"]*)"#\1 href=\"\2../../../../../nrf.docset/Contents/Resources/Documents/\3"#g' {} +
          find . -type f -name "*.html" -exec sed -i -E 's#(a|class=\"reference external\") href="([^"]*)\.\./zephyr/([^"]*)"#\1 href=\"\2../../../../../zephyr.docset/Contents/Resources/Documents/\3"#g' {} +
          find . -type f -name "*.html" -exec sed -i -E 's#(a|class=\"reference external\") href="([^"]*)\.\./tfm/([^"]*)"#\1 href=\"\2../../../../../tfm.docset/Contents/Resources/Documents/\3"#g' {} +

      - name: Compress Docsets
        working-directory: ncs/nrf/doc/_build/docsets/
        run: for i in *.docset; do tar czf "$i".tgz "$i"; done

      - name: Upload docset artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: docsets
          path: ncs/nrf/doc/_build/docsets/*.tgz

      - name: Store
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'external') || contains(github.event.pull_request.labels.*.name, 'CI-trusted-author') }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: docs
          path: |
            ncs/nrf/*.zip
            ncs/nrf/monitor*.txt
            ncs/nrf/pr.txt
            ncs/nrf/comment.txt
